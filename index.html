<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florida Congressional District Candidate Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <style>
      #map-frame {
        touch-action: none;
        overscroll-behavior: contain;
        background: transparent;
      }

      #map-frame svg {
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .district-shape {
        cursor: pointer;
        transition: opacity 120ms ease, stroke-width 120ms ease, filter 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .district-shape.is-hovered {
        stroke: #0f172a;
        stroke-width: 2.3;
        filter: brightness(1.04);
      }

      .district-shape:focus,
      .district-shape:focus-visible {
        outline: none;
      }

      .filter-chip.active,
      .filter-chip.active:hover,
      .filter-chip.active:active {
        background: #eff6ff;
        color: #1e3a8a;
        border-color: #1d4ed8;
        box-shadow: 0 0 0 1px rgba(29, 78, 216, 0.35);
      }

      .app-nav {
        position: sticky;
        top: 0;
        z-index: 60;
        border-bottom: 1px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(12px);
      }

      .menu-toggle {
        width: 2.5rem;
        height: 2.5rem;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.26rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.6rem;
        background: #ffffff;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      .menu-toggle:hover {
        background: #f8fafc;
      }

      .menu-toggle-line {
        width: 1rem;
        height: 2px;
        border-radius: 999px;
        background: #334155;
        transition: transform 140ms ease, opacity 140ms ease;
      }

      .menu-toggle.is-open .menu-toggle-line:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }

      .menu-toggle.is-open .menu-toggle-line:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.is-open .menu-toggle-line:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }

      .menu-backdrop {
        position: fixed;
        inset: 0;
        z-index: 64;
        background: rgba(15, 23, 42, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 170ms ease;
      }

      .menu-backdrop.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-drawer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 70;
        width: min(86vw, 20rem);
        height: 100dvh;
        padding: 1rem;
        border-left: 1px solid #e2e8f0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        transform: translateX(100%);
        transition: transform 190ms ease;
      }

      .mobile-drawer.is-open {
        transform: translateX(0);
      }

      .mobile-nav-link {
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 0.65rem;
        background: #ffffff;
        padding: 0.6rem 0.75rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: #334155;
        display: inline-flex;
        align-items: center;
      }

      .theme-switch {
        position: relative;
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 0.65rem;
        background: #ffffff;
        padding: 0.5rem 0.65rem;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.65rem;
        cursor: pointer;
      }

      .theme-switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .theme-switch-text {
        font-size: 0.8rem;
        font-weight: 600;
        color: #334155;
      }

      .theme-switch-track {
        position: relative;
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: #cbd5e1;
        transition: background-color 130ms ease;
      }

      .theme-switch-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.28);
        transition: transform 130ms ease;
      }

      .theme-switch input:checked + .theme-switch-track {
        background: #0f172a;
      }

      .theme-switch input:checked + .theme-switch-track::after {
        transform: translateX(16px);
      }

      .theme-switch:focus-within,
      .menu-toggle:focus-visible,
      .mobile-nav-link:focus-visible {
        outline: 2px solid #94a3b8;
        outline-offset: 2px;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      html[data-theme="dark"] body {
        background-color: #020617 !important;
        color: #e2e8f0 !important;
      }

      html[data-theme="dark"] .app-nav {
        background: rgba(15, 23, 42, 0.88);
        border-color: #334155;
      }

      html[data-theme="dark"] .menu-toggle,
      html[data-theme="dark"] .mobile-nav-link,
      html[data-theme="dark"] .theme-switch,
      html[data-theme="dark"] .mobile-drawer {
        background: #0f172a;
        border-color: #334155;
      }

      html[data-theme="dark"] .menu-toggle-line {
        background-color: #cbd5e1;
      }

      html[data-theme="dark"] .mobile-nav-link,
      html[data-theme="dark"] .theme-switch-text {
        color: #cbd5e1;
      }

      html[data-theme="dark"] .theme-switch-track {
        background: #475569;
      }

      html[data-theme="dark"] .theme-switch input:checked + .theme-switch-track {
        background: #e2e8f0;
      }

      html[data-theme="dark"] .theme-switch input:checked + .theme-switch-track::after {
        background: #0f172a;
      }

      html[data-theme="dark"] .bg-white {
        background-color: #0f172a !important;
      }

      html[data-theme="dark"] .bg-slate-50 {
        background-color: #1e293b !important;
      }

      html[data-theme="dark"] .border-slate-200,
      html[data-theme="dark"] .border-slate-300 {
        border-color: #334155 !important;
      }

      html[data-theme="dark"] .text-slate-900 {
        color: #f8fafc !important;
      }

      html[data-theme="dark"] .text-slate-700 {
        color: #cbd5e1 !important;
      }

      html[data-theme="dark"] #stat-dem-seats {
        color: #1f5fbd;
      }

      html[data-theme="dark"] #stat-rep-seats {
        color: #E13D37;
      }

      html[data-theme="dark"] .text-slate-600,
      html[data-theme="dark"] .text-slate-500 {
        color: #94a3b8 !important;
      }

      html[data-theme="dark"] .hover\:bg-slate-50:hover {
        background-color: #243244 !important;
      }

      html[data-theme="dark"] .hover\:bg-slate-100:hover {
        background-color: #2b3a4f !important;
      }

      html[data-theme="dark"] .filter-chip.active,
      html[data-theme="dark"] .filter-chip.active:hover,
      html[data-theme="dark"] .filter-chip.active:active {
        background: #e2e8f0;
        color: #0f172a;
        border-color: #38bdf8;
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.45);
      }

      html[data-theme="dark"] .overlay-toggle {
        background: #1e293b;
        border-color: #475569;
      }

      html[data-theme="dark"] .overlay-toggle:hover {
        background: #243244;
      }

      html[data-theme="dark"] .overlay-toggle-switch {
        background: #475569;
      }

      html[data-theme="dark"] .overlay-toggle-label {
        color: #ffffff;
      }

      html[data-theme="dark"] .mode-select-button {
        background: #0f172a;
        border-color: #334155;
        color: #cbd5e1;
      }

      html[data-theme="dark"] .mode-select-button:hover {
        background: #243244;
      }

      html[data-theme="dark"] .mode-select-button.is-active {
        background: #e2e8f0;
        color: #0f172a;
        border-color: #38bdf8;
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.45);
      }

      html[data-theme="dark"] #map-tooltip {
        background: #0f172a;
        border-color: #475569;
        color: #e2e8f0;
      }

      .top-stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .top-dates-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .top-card {
        min-height: 64px;
      }

      .top-card-label {
        font-size: 10px;
        line-height: 1.2;
        letter-spacing: 0.07em;
      }

      .top-card-value {
        line-height: 1.05;
      }

      .map-filter-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .map-filter-chip {
        min-height: 40px;
      }

      .overlay-toggle-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .map-color-mode-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mode-select-button {
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 0.65rem;
        background: #ffffff;
        color: #334155;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        padding: 0.45rem 0.6rem;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
      }

      .mode-select-button:hover {
        background: #f8fafc;
      }

      .mode-select-button:focus-visible {
        outline: 2px solid #94a3b8;
        outline-offset: 2px;
      }

      .mode-select-button.is-active {
        background: #eff6ff;
        color: #1e3a8a;
        border-color: #1d4ed8;
        box-shadow: 0 0 0 1px rgba(29, 78, 216, 0.35);
      }

      .overlay-toggle {
        position: relative;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.55rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.65rem;
        background: #f8fafc;
        padding: 0.4rem 0.55rem;
        cursor: pointer;
        user-select: none;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      .overlay-toggle:hover {
        background: #f1f5f9;
      }

      .overlay-toggle:focus-within {
        outline: 2px solid #94a3b8;
        outline-offset: 2px;
      }

      .overlay-toggle input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .overlay-toggle-label {
        font-size: 12px;
        line-height: 1.2;
        font-weight: 600;
        color: #000000;
      }

      .overlay-toggle-switch {
        position: relative;
        width: 34px;
        height: 20px;
        flex: none;
        border-radius: 999px;
        background: #cbd5e1;
        transition: background-color 120ms ease;
      }

      .overlay-toggle-switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.25);
        transition: transform 120ms ease;
      }

      .overlay-toggle input:checked ~ .overlay-toggle-switch {
        background: #0f172a;
      }

      .overlay-toggle input:checked ~ .overlay-toggle-switch::after {
        transform: translateX(14px);
      }

      @media (max-width: 960px) {
        .map-filter-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .map-filter-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .map-color-mode-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .overlay-toggle-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .map-filter-chip {
          min-height: 42px;
        }
      }

      @media (max-width: 430px) {
        .overlay-toggle-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 359px) {
        .top-stats-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 320px) {
        .map-filter-grid,
        .top-stats-grid,
        .top-dates-grid {
          grid-template-columns: 1fr;
        }
      }

    </style>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <nav class="app-nav">
      <div class="mx-auto flex h-14 max-w-[1500px] items-center justify-between px-4">
        <a href="#overview-panel" class="text-sm font-semibold tracking-wide text-slate-900 sm:text-base">
          Florida Congressional Districts
        </a>

        <button
          id="menu-toggle"
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Open menu"
        >
          <span class="menu-toggle-line"></span>
          <span class="menu-toggle-line"></span>
          <span class="menu-toggle-line"></span>
        </button>
      </div>
    </nav>

    <div id="mobile-menu-backdrop" class="menu-backdrop"></div>
    <aside id="mobile-menu" class="mobile-drawer" aria-hidden="true">
      <p class="px-1 text-xs font-semibold uppercase tracking-wide text-slate-500">Menu</p>
      <label class="theme-switch mt-1">
        <span class="theme-switch-text">Dark Mode</span>
        <input id="theme-toggle-mobile" type="checkbox" aria-label="Toggle dark mode" />
        <span class="theme-switch-track" aria-hidden="true"></span>
      </label>
    </aside>

    <main class="mx-auto max-w-[1500px] p-4 md:p-6 lg:p-8">
      <header id="overview-panel" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5 md:p-6">
        <dl class="top-stats-grid mt-0 grid gap-1.5">
          <div
            data-stat-filter="all"
            role="button"
            tabindex="0"
            class="top-card rounded-md bg-slate-50 p-1.5 transition-colors hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
            aria-label="Show all districts"
          >
            <dt class="top-card-label uppercase text-slate-500">Districts</dt>
            <dd
              id="stat-districts"
              class="top-card-value mt-0.5 text-lg font-semibold text-slate-900 sm:text-xl"
            >
              -
            </dd>
          </div>
          <div
            data-stat-filter="D"
            role="button"
            tabindex="0"
            class="top-card rounded-md bg-slate-50 p-1.5 transition-colors hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
            aria-label="Show D-Held districts"
          >
            <dt class="top-card-label uppercase text-slate-500">D-Held Seats</dt>
            <dd
              id="stat-dem-seats"
              class="top-card-value mt-0.5 text-lg font-semibold text-slate-900 sm:text-xl"
            >
              -
            </dd>
          </div>
          <div
            data-stat-filter="R"
            role="button"
            tabindex="0"
            class="top-card rounded-md bg-slate-50 p-1.5 transition-colors hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
            aria-label="Show R-Held districts"
          >
            <dt class="top-card-label uppercase text-slate-500">R-Held Seats</dt>
            <dd
              id="stat-rep-seats"
              class="top-card-value mt-0.5 text-lg font-semibold text-slate-900 sm:text-xl"
            >
              -
            </dd>
          </div>
        </dl>

        <dl class="top-dates-grid mt-1.5 grid gap-1.5">
          <div class="top-card rounded-md bg-slate-50 p-1.5">
            <dt class="top-card-label uppercase text-slate-500">Primary Election</dt>
            <dd
              id="stat-primary-date"
              class="top-card-value mt-0.5 whitespace-nowrap text-base font-semibold text-slate-900 sm:text-lg"
            >
              -
            </dd>
          </div>
          <div class="top-card rounded-md bg-slate-50 p-1.5">
            <dt class="top-card-label uppercase text-slate-500">General Election</dt>
            <dd
              id="stat-general-date"
              class="top-card-value mt-0.5 whitespace-nowrap text-base font-semibold text-slate-900 sm:text-lg"
            >
              -
            </dd>
          </div>
        </dl>
      </header>

      <div class="mt-3 sm:mt-4">
        <section id="map-panel" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:p-5">
          <div id="map-view">
            <div
              id="map-frame"
              class="relative h-[62vh] min-h-[500px] overflow-hidden rounded-xl border border-slate-200 bg-transparent"
            >
              <div id="map-viewport" class="absolute inset-0 grid place-items-center text-sm text-slate-500">
                Loading map...
              </div>
              <div
                id="map-tooltip"
                class="pointer-events-none absolute hidden max-h-[360px] max-w-[360px] overflow-auto rounded-md border border-slate-300 bg-white px-3 py-2 text-xs shadow-lg"
              ></div>
            </div>

            <div class="mt-3 flex flex-wrap items-center justify-center gap-3 text-xs text-slate-500 sm:justify-start">
              <span class="inline-flex items-center gap-1">
                <span id="legend-dot-d" class="h-2.5 w-2.5 rounded-full"></span>
                <span id="legend-label-d">D-held</span>
              </span>
              <span class="inline-flex items-center gap-1">
                <span id="legend-dot-r" class="h-2.5 w-2.5 rounded-full"></span>
                <span id="legend-label-r">R-held</span>
              </span>
              <span class="inline-flex items-center gap-1">
                <span id="legend-dot-other" class="h-2.5 w-2.5 rounded-full"></span>
                <span id="legend-label-other">Other/Unknown</span>
              </span>
            </div>

            <div class="mt-3 border-t border-slate-200 pt-3">
              <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Filters</p>
              <div class="map-filter-grid mt-2 grid gap-2">
                <button
                  type="button"
                  data-filter="all"
                  class="filter-chip map-filter-chip active inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-2.5 py-2 text-center text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                >
                  All Districts
                </button>
                <button
                  type="button"
                  data-filter="D"
                  class="filter-chip map-filter-chip inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-2.5 py-2 text-center text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                >
                  D-Held
                </button>
                <button
                  type="button"
                  data-filter="R"
                  class="filter-chip map-filter-chip inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-2.5 py-2 text-center text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                >
                  R-Held
                </button>
                <button
                  type="button"
                  data-filter="noD"
                  class="filter-chip map-filter-chip inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-2.5 py-2 text-center text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                >
                  No D-Candidates
                </button>
                <button
                  type="button"
                  data-filter="noR"
                  class="filter-chip map-filter-chip inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-2.5 py-2 text-center text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                >
                  No R-Candidates
                </button>
                <button
                  id="reset-view"
                  type="button"
                  class="map-filter-chip inline-flex w-full items-center justify-center rounded-md border border-slate-300 bg-white px-2.5 py-2 text-center text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                >
                  Recenter View
                </button>
              </div>
            </div>

            <div class="mt-3 border-t border-slate-200 pt-3">
              <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Shading</p>
              <div class="map-color-mode-grid mt-2 grid gap-2" role="group" aria-label="Map coloring mode">
                <button
                  id="color-mode-cook-pvi"
                  type="button"
                  data-color-mode="pvi"
                  class="mode-select-button"
                  aria-pressed="true"
                >
                  Cook PVI
                </button>
                <button
                  id="color-mode-seat-party"
                  type="button"
                  data-color-mode="seat-holder"
                  class="mode-select-button"
                  aria-pressed="false"
                >
                  Incumbent
                </button>
              </div>
            </div>

            <div class="mt-3 border-t border-slate-200 pt-3">
              <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Overlays</p>
              <div class="overlay-toggle-grid mt-2 grid gap-2">
                <label class="overlay-toggle">
                  <input id="toggle-district-numbers" type="checkbox" />
                  <span class="overlay-toggle-label">District Numbers</span>
                  <span class="overlay-toggle-switch" aria-hidden="true"></span>
                </label>
                <label class="overlay-toggle">
                  <input id="toggle-county-lines" type="checkbox" />
                  <span class="overlay-toggle-label">County Borders</span>
                  <span class="overlay-toggle-switch" aria-hidden="true"></span>
                </label>
                <label class="overlay-toggle">
                  <input id="toggle-county-names" type="checkbox" />
                  <span class="overlay-toggle-label">County Names</span>
                  <span class="overlay-toggle-switch" aria-hidden="true"></span>
                </label>
              </div>
            </div>
          </div>

          <div id="district-card-view" class="mt-4 hidden rounded-xl border border-slate-200 bg-slate-50 p-4 md:p-5">
            <button
              id="back-to-map"
              type="button"
              class="min-h-[44px] w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50 sm:w-auto sm:py-1"
            >
              Back to map
            </button>

            <h2 id="selected-title" class="mt-4 text-xl font-semibold text-slate-900">District -</h2>
            <div class="mt-4 grid gap-3 sm:grid-cols-2">
              <section id="selected-incumbent-card" class="rounded-lg border border-slate-200 p-3">
                <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Incumbent</h3>
                <p id="selected-incumbent" class="mt-2 text-sm text-slate-700"></p>
              </section>
              <section id="selected-pvi-card" class="rounded-lg border border-slate-200 p-3">
                <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500">2025 Cook PVI</h3>
                <p id="selected-pvi" class="mt-2 text-sm font-semibold text-slate-700"></p>
              </section>
            </div>

            <section class="mt-4">
              <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Candidates</h3>
              <div id="candidate-lists" class="mt-3 space-y-3"></div>
            </section>
          </div>
        </section>
      </div>
    </main>

    <script>
      const DISTRICT_FILL_DARK_BY_PARTY = {
        D: "#1f5fbd",
        R: "#E13D37",
        OTHER: "#94a3b8",
      };
      const PVI_LEGEND_COLOR = {
        D: "#3b82f6",
        R: "#ef4444",
        EVEN: "#94a3b8",
      };
      const PVI_COLOR_STOPS = [
        { min: 20, D: "#1e3a8a", R: "#7f1d1d" },
        { min: 17, D: "#1d4ed8", R: "#b91c1c" },
        { min: 14, D: "#2563eb", R: "#dc2626" },
        { min: 11, D: "#3b82f6", R: "#ef4444" },
        { min: 8, D: "#60a5fa", R: "#f87171" },
        { min: 5, D: "#93c5fd", R: "#fca5a5" },
        { min: 0, D: "#bfdbfe", R: "#fecaca" },
      ];
      const MAP_BACKGROUND_FILL = "transparent";
      const FILTERED_OUT_FILL_LIGHT = "#dbe3ee";
      const FILTERED_OUT_FILL_DARK = "#334155";
      const MAP_COUNTY_BORDERS_COLOR = "#ffffff";
      const MAP_COUNTY_BORDERS_OPACITY = "0.3";
      const MAP_OVERLAY_COLOR = "#cbd5e1";
      const MAP_MIN_ZOOM = 0.8;
      const MAP_MAX_ZOOM = 11;
      const LARGE_SCREEN_MIN_WIDTH = 1200;
      const MAP_DEFAULT_PAN_X = -30;
      const MAP_GESTURE_CLICK_SUPPRESS_MS = 250;
      const TAP_MAX_MOVEMENT_PX = 10;
      const TAP_MAX_DURATION_MS = 450;
      const ZOOM_EPSILON = 0.001;
      const PAN_EPSILON = 0.5;
      const THEME_STORAGE_KEY = "fl-map-theme";

      const app = {
        data: null,
        mapSvg: null,
        selectedDistrict: null,
        hoveredDistrict: null,
        filter: "all",
        mapInteraction: {
          zoomBehavior: null,
          zoomSelection: null,
          zoomLayer: null,
          currentTransform: null,
          gestureDidTransform: false,
          activeTapByPointerId: new Map(),
        },
        districtPaths: new Map(),
        districtNumberLabels: new Map(),
        countyNameLabels: [],
        overlays: {
          districtNumbers: true,
          countyLines: false,
          countyNames: false,
        },
        overlayLayers: {
          districtNumbers: null,
          countyLines: null,
          countyNames: null,
        },
        suppressMapClickUntil: 0,
        mobileMenuOpen: false,
        theme: "light",
        colorMode: "pvi",
      };

      const els = {
        statDistricts: document.getElementById("stat-districts"),
        statDemSeats: document.getElementById("stat-dem-seats"),
        statRepSeats: document.getElementById("stat-rep-seats"),
        statPrimaryDate: document.getElementById("stat-primary-date"),
        statGeneralDate: document.getElementById("stat-general-date"),
        mapView: document.getElementById("map-view"),
        districtCardView: document.getElementById("district-card-view"),
        backToMap: document.getElementById("back-to-map"),
        mapFrame: document.getElementById("map-frame"),
        mapViewport: document.getElementById("map-viewport"),
        mapTooltip: document.getElementById("map-tooltip"),
        resetView: document.getElementById("reset-view"),
        selectedTitle: document.getElementById("selected-title"),
        selectedIncumbentCard: document.getElementById("selected-incumbent-card"),
        selectedIncumbent: document.getElementById("selected-incumbent"),
        candidateLists: document.getElementById("candidate-lists"),
        legendDotD: document.getElementById("legend-dot-d"),
        legendDotR: document.getElementById("legend-dot-r"),
        legendDotOther: document.getElementById("legend-dot-other"),
        legendLabelD: document.getElementById("legend-label-d"),
        legendLabelR: document.getElementById("legend-label-r"),
        legendLabelOther: document.getElementById("legend-label-other"),
        toggleDistrictNumbers: document.getElementById("toggle-district-numbers"),
        toggleCountyLines: document.getElementById("toggle-county-lines"),
        toggleCountyNames: document.getElementById("toggle-county-names"),
        colorModeSeatParty: document.getElementById("color-mode-seat-party"),
        colorModeCookPvi: document.getElementById("color-mode-cook-pvi"),
        menuToggle: document.getElementById("menu-toggle"),
        mobileMenu: document.getElementById("mobile-menu"),
        mobileMenuBackdrop: document.getElementById("mobile-menu-backdrop"),
        themeToggleMobile: document.getElementById("theme-toggle-mobile"),
        selectedPviCard: document.getElementById("selected-pvi-card"),
        selectedPvi: document.getElementById("selected-pvi"),
      };

      init();

      async function init() {
        wireNavbarControls();
        wireStaticControls();
        wirePageZoomGuards();
        syncLegendColors();
        syncMapColorModeControls();
        syncOverlayToggleControls();
        showMapMessage("Loading map...");

        try {
          const [rawData, svgText] = await Promise.all([
            loadJson("./fl-congressional-district-candidates.json"),
            loadText("./florida-congressional-districts.svg"),
          ]);

          app.data = normalizeData(rawData);
          renderHeaderStats();

          const mapParts = buildInteractiveMap(svgText);
          mountMap(mapParts.svg, mapParts.zoomLayer, mapParts.districtGroup, mapParts.overlayLayers);

          setFilter("all");
          renderSelectedDistrict();
        } catch (error) {
          const message =
            "Could not load local files. Serve this folder over HTTP (for example: `python -m http.server`) and reload.";
          showMapMessage(message, true);
          console.error(error);
        }
      }

      function wireNavbarControls() {
        setTheme(getPreferredTheme());

        [els.themeToggleMobile].forEach((toggle) => {
          if (!toggle) {
            return;
          }
          toggle.addEventListener("change", (event) => {
            setTheme(event.target.checked ? "dark" : "light");
          });
        });

        if (els.menuToggle) {
          els.menuToggle.addEventListener("click", () => {
            setMobileMenuOpen(!app.mobileMenuOpen);
          });
        }
        if (els.mobileMenuBackdrop) {
          els.mobileMenuBackdrop.addEventListener("click", () => setMobileMenuOpen(false));
        }
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && app.mobileMenuOpen) {
            setMobileMenuOpen(false);
          }
        });

      }

      function setMobileMenuOpen(isOpen) {
        const nextOpen = Boolean(isOpen);
        app.mobileMenuOpen = nextOpen;

        if (els.mobileMenu) {
          els.mobileMenu.classList.toggle("is-open", nextOpen);
          els.mobileMenu.setAttribute("aria-hidden", String(!nextOpen));
        }
        if (els.mobileMenuBackdrop) {
          els.mobileMenuBackdrop.classList.toggle("is-open", nextOpen);
        }
        if (els.menuToggle) {
          els.menuToggle.classList.toggle("is-open", nextOpen);
          els.menuToggle.setAttribute("aria-expanded", String(nextOpen));
          els.menuToggle.setAttribute("aria-label", nextOpen ? "Close menu" : "Open menu");
        }

        document.body.style.overflow = nextOpen ? "hidden" : "";
      }

      function getPreferredTheme() {
        const storedTheme = readStoredTheme();
        if (storedTheme) {
          return storedTheme;
        }
        return "light";
      }

      function readStoredTheme() {
        try {
          const stored = localStorage.getItem(THEME_STORAGE_KEY);
          return stored === "dark" || stored === "light" ? stored : null;
        } catch {
          return null;
        }
      }

      function setTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        app.theme = nextTheme;
        document.documentElement.setAttribute("data-theme", nextTheme);
        document.documentElement.style.colorScheme = nextTheme;

        const isDark = nextTheme === "dark";
        [els.themeToggleMobile].forEach((toggle) => {
          if (toggle) {
            toggle.checked = isDark;
          }
        });

        try {
          localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        } catch {
          // ignore storage write failures
        }

        if (app.data) {
          paintDistricts();
          renderSelectedDistrict();
        }
      }

      function setColorMode(mode) {
        const nextMode = mode === "pvi" ? "pvi" : "seat-holder";
        app.colorMode = nextMode;
        syncMapColorModeControls();
        syncLegendColors();
        paintDistricts();
      }

      function getPviLegendColors() {
        const referenceStop =
          PVI_COLOR_STOPS.find((entry) => entry.min === 11) || PVI_COLOR_STOPS[Math.floor(PVI_COLOR_STOPS.length / 2)];
        return {
          D: referenceStop?.D || PVI_LEGEND_COLOR.D,
          R: referenceStop?.R || PVI_LEGEND_COLOR.R,
          EVEN: PVI_LEGEND_COLOR.EVEN,
        };
      }

      function wireStaticControls() {
        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.addEventListener("click", () => setFilter(button.dataset.filter));
        });
        document.querySelectorAll("[data-stat-filter]").forEach((card) => {
          const applyStatFilter = () => setFilter(card.dataset.statFilter);
          card.addEventListener("click", applyStatFilter);
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              applyStatFilter();
            }
          });
        });

        els.resetView.addEventListener("click", () => {
          showMapView();
          requestAnimationFrame(() => {
            applyDefaultMapView();
          });
        });

        els.backToMap.addEventListener("click", showMapView);
        if (els.colorModeSeatParty) {
          els.colorModeSeatParty.addEventListener("click", () => {
            setColorMode("seat-holder");
          });
        }
        if (els.colorModeCookPvi) {
          els.colorModeCookPvi.addEventListener("click", () => {
            setColorMode("pvi");
          });
        }
        els.toggleDistrictNumbers.addEventListener("change", (event) => {
          setOverlay("districtNumbers", event.target.checked);
        });
        els.toggleCountyLines.addEventListener("change", (event) => {
          setOverlay("countyLines", event.target.checked);
        });
        els.toggleCountyNames.addEventListener("change", (event) => {
          setOverlay("countyNames", event.target.checked);
        });
      }

      function wirePageZoomGuards() {
        const isInsideMapFrame = (target) => target instanceof Node && els.mapFrame.contains(target);

        document.addEventListener(
          "wheel",
          (event) => {
            if (!event.ctrlKey || isInsideMapFrame(event.target)) {
              return;
            }
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "touchmove",
          (event) => {
            if (event.touches.length < 2 || isInsideMapFrame(event.target)) {
              return;
            }
            event.preventDefault();
          },
          { passive: false }
        );

        ["gesturestart", "gesturechange"].forEach((type) => {
          document.addEventListener(
            type,
            (event) => {
              if (isInsideMapFrame(event.target)) {
                return;
              }
              event.preventDefault();
            },
            { passive: false }
          );
        });

        let lastTouchEndAt = 0;
        document.addEventListener(
          "touchend",
          (event) => {
            if (isInsideMapFrame(event.target)) {
              return;
            }

            const now = Date.now();
            if (now - lastTouchEndAt < 320) {
              event.preventDefault();
            }
            lastTouchEndAt = now;
          },
          { passive: false }
        );
      }

      function syncLegendColors() {
        if (app.colorMode === "pvi") {
          const pviLegendColors = getPviLegendColors();
          els.legendDotD.style.backgroundColor = pviLegendColors.D;
          els.legendDotR.style.backgroundColor = pviLegendColors.R;
          els.legendDotOther.style.backgroundColor = pviLegendColors.EVEN;
          els.legendLabelD.textContent = "D-lean PVI";
          els.legendLabelR.textContent = "R-lean PVI";
          els.legendLabelOther.textContent = "Even/Unknown";
        } else {
          els.legendDotD.style.backgroundColor = DISTRICT_FILL_DARK_BY_PARTY.D;
          els.legendDotR.style.backgroundColor = DISTRICT_FILL_DARK_BY_PARTY.R;
          els.legendDotOther.style.backgroundColor = DISTRICT_FILL_DARK_BY_PARTY.OTHER;
          els.legendLabelD.textContent = "D-held";
          els.legendLabelR.textContent = "R-held";
          els.legendLabelOther.textContent = "Other/Unknown";
        }
        els.statDemSeats.style.color = DISTRICT_FILL_DARK_BY_PARTY.D;
        els.statRepSeats.style.color = DISTRICT_FILL_DARK_BY_PARTY.R;
      }

      function syncMapColorModeControls() {
        const isPvi = app.colorMode === "pvi";
        if (els.colorModeSeatParty) {
          els.colorModeSeatParty.classList.toggle("is-active", !isPvi);
          els.colorModeSeatParty.setAttribute("aria-pressed", String(!isPvi));
        }
        if (els.colorModeCookPvi) {
          els.colorModeCookPvi.classList.toggle("is-active", isPvi);
          els.colorModeCookPvi.setAttribute("aria-pressed", String(isPvi));
        }
      }

      function syncOverlayToggleControls() {
        els.toggleDistrictNumbers.checked = app.overlays.districtNumbers;
        els.toggleCountyLines.checked = app.overlays.countyLines;
        els.toggleCountyNames.checked = app.overlays.countyNames;
      }

      async function loadJson(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`JSON request failed: ${response.status}`);
        }
        return response.json();
      }

      async function loadText(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`SVG request failed: ${response.status}`);
        }
        return response.text();
      }

      function normalizeData(rawData) {
        if (!rawData || !Array.isArray(rawData.districts) || rawData.districts.length === 0) {
          throw new Error("Candidate JSON has no districts.");
        }

        const districts = rawData.districts
          .map((district) => ({
            ...district,
            cook_pvi_2025: normalizeCookPvi(district.cook_pvi_2025),
          }))
          .sort((a, b) => a.district - b.district);

        return { ...rawData, districts };
      }

      function renderHeaderStats() {
        const districts = app.data.districts;
        const demSeats = districts.filter((district) => district.current_holder?.party === "D").length;
        const repSeats = districts.filter((district) => district.current_holder?.party === "R").length;

        els.statDistricts.textContent = String(districts.length);
        els.statDemSeats.textContent = String(demSeats);
        els.statRepSeats.textContent = String(repSeats);
        els.statPrimaryDate.textContent = formatDate(app.data.primary_date);
        els.statGeneralDate.textContent = formatDate(app.data.general_election_date);
      }

      function buildInteractiveMap(svgText) {
        const ns = "http://www.w3.org/2000/svg";
        const parsed = new DOMParser().parseFromString(svgText, "image/svg+xml");
        if (parsed.querySelector("parsererror")) {
          throw new Error("Unable to parse SVG.");
        }

        const sourceSvg = parsed.documentElement;
        const sourceDistrictGroup = sourceSvg.querySelector("g#tl_rd22_12_cd118");
        if (!sourceDistrictGroup) {
          throw new Error("District group `tl_rd22_12_cd118` not found in SVG.");
        }

        const viewBox = sourceSvg.getAttribute("viewBox") || "0 0 800 651";
        const [x, y, w, h] = viewBox.split(/\s+/).map(Number);

        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", viewBox);
        svg.setAttribute("aria-label", "Interactive Florida congressional districts map");
        svg.setAttribute("role", "img");
        const defs = document.createElementNS(ns, "defs");
        let countyLinesClipId = null;
        const zoomLayer = document.createElementNS(ns, "g");
        zoomLayer.setAttribute("id", "zoom-layer");

        const background = document.createElementNS(ns, "rect");
        background.setAttribute("x", String(Number.isFinite(x) ? x : 0));
        background.setAttribute("y", String(Number.isFinite(y) ? y : 0));
        background.setAttribute("width", String(Number.isFinite(w) ? w : 800));
        background.setAttribute("height", String(Number.isFinite(h) ? h : 651));
        background.setAttribute("fill", MAP_BACKGROUND_FILL);
        zoomLayer.appendChild(background);

        const outlineSource = sourceSvg.querySelector("g#layer2 > path");
        if (outlineSource) {
          const outline = outlineSource.cloneNode(true);
          outline.setAttribute("fill", "#e5efff");
          outline.setAttribute("stroke", "#94a3b8");
          outline.setAttribute("stroke-width", "1.2");
          outline.setAttribute("vector-effect", "non-scaling-stroke");
          outline.setAttribute("pointer-events", "none");
          zoomLayer.appendChild(outline);

          countyLinesClipId = "state-boundary-clip";
          const countyLinesClip = document.createElementNS(ns, "clipPath");
          countyLinesClip.setAttribute("id", countyLinesClipId);
          countyLinesClip.setAttribute("clipPathUnits", "userSpaceOnUse");
          const clipShape = outlineSource.cloneNode(true);
          clipShape.setAttribute("fill", "#ffffff");
          clipShape.setAttribute("stroke", "none");
          clipShape.setAttribute("stroke-width", "0");
          clipShape.removeAttribute("vector-effect");
          clipShape.setAttribute("pointer-events", "none");
          countyLinesClip.appendChild(clipShape);
          defs.appendChild(countyLinesClip);
        }
        if (defs.childElementCount > 0) {
          svg.appendChild(defs);
        }
        svg.appendChild(zoomLayer);

        const districtGroup = sourceDistrictGroup.cloneNode(true);
        districtGroup.setAttribute("id", "district-layer");

        districtGroup.querySelectorAll("path").forEach((path) => {
          const districtNumber = parseDistrictNumber(path.getAttribute("id"));
          if (!districtNumber) {
            path.remove();
            return;
          }

          path.setAttribute("data-district", String(districtNumber));
          path.setAttribute("tabindex", "0");
          path.setAttribute("role", "button");
          path.setAttribute("aria-label", `Congressional District ${districtNumber}`);
          path.setAttribute("stroke", "#000000");
          path.setAttribute("stroke-width", "0.8");
          path.setAttribute("vector-effect", "non-scaling-stroke");
          path.classList.add("district-shape");
        });

        zoomLayer.appendChild(districtGroup);
        const countyLinesLayer = document.createElementNS(ns, "g");
        countyLinesLayer.setAttribute("id", "county-lines-layer");
        countyLinesLayer.setAttribute("pointer-events", "none");
        if (countyLinesClipId) {
          countyLinesLayer.setAttribute("clip-path", `url(#${countyLinesClipId})`);
        }

        ["g#tl_2021_us_county", "g#tl_2021_us_county1"].forEach((selector) => {
          const sourceGroup = sourceSvg.querySelector(selector);
          if (!sourceGroup) {
            return;
          }

          sourceGroup.querySelectorAll("path").forEach((sourcePath) => {
            const path = sourcePath.cloneNode(true);
            path.setAttribute("fill", "none");
            path.setAttribute("fill-opacity", "0");
            path.setAttribute("stroke", MAP_COUNTY_BORDERS_COLOR);
            path.setAttribute("stroke-opacity", MAP_COUNTY_BORDERS_OPACITY);
            path.setAttribute("stroke-width", "0.45");
            path.setAttribute("vector-effect", "non-scaling-stroke");
            path.setAttribute("pointer-events", "none");
            countyLinesLayer.appendChild(path);
          });
        });

        const districtBordersLayer = document.createElementNS(ns, "g");
        districtBordersLayer.setAttribute("id", "district-borders-layer");
        districtBordersLayer.setAttribute("pointer-events", "none");
        districtGroup.querySelectorAll("path").forEach((sourcePath) => {
          const path = sourcePath.cloneNode(true);
          path.removeAttribute("id");
          path.removeAttribute("data-district");
          path.removeAttribute("tabindex");
          path.removeAttribute("role");
          path.removeAttribute("aria-label");
          path.setAttribute("fill", "none");
          path.setAttribute("fill-opacity", "0");
          path.setAttribute("stroke", "#000000");
          path.setAttribute("stroke-width", "0.8");
          path.setAttribute("vector-effect", "non-scaling-stroke");
          path.setAttribute("pointer-events", "none");
          path.classList.remove("district-shape");
          path.classList.remove("is-hovered");
          districtBordersLayer.appendChild(path);
        });

        let countyNamesLayer = null;
        const sourceCountyNamesLayer = sourceSvg.querySelector("g#layer3");
        if (sourceCountyNamesLayer) {
          countyNamesLayer = sourceCountyNamesLayer.cloneNode(true);
          countyNamesLayer.setAttribute("id", "county-names-layer");
          countyNamesLayer.setAttribute("pointer-events", "none");
          countyNamesLayer.querySelectorAll("text").forEach((text) => {
            const anchorPoint = getTextAnchorPoint(text);
            if (anchorPoint) {
              text.setAttribute("data-anchor-x", String(anchorPoint.x));
              text.setAttribute("data-anchor-y", String(anchorPoint.y));
            }
            text.setAttribute("fill", "#000000");
            text.setAttribute("stroke", "none");
            text.setAttribute("font-weight", "400");
            text.setAttribute("fill-opacity", "1");
            text.setAttribute("pointer-events", "none");
          });
        }

        let districtNumbersLayer = null;
        const sourceDistrictNumbersLayer = sourceSvg.querySelector("g#layer1");
        if (sourceDistrictNumbersLayer) {
          districtNumbersLayer = sourceDistrictNumbersLayer.cloneNode(true);
          districtNumbersLayer.setAttribute("id", "district-numbers-layer");
          districtNumbersLayer.setAttribute("pointer-events", "none");
          districtNumbersLayer.querySelectorAll("text").forEach((text) => {
            const districtNumber = Number(String(text.textContent || "").trim());
            if (districtNumber) {
              text.setAttribute("data-district", String(districtNumber));
            }
            text.setAttribute("fill", "#000000");
            text.setAttribute("stroke", "none");
            text.setAttribute("font-weight", "400");
            text.setAttribute("fill-opacity", "1");
            text.setAttribute("pointer-events", "none");
          });
        }

        countyLinesLayer.style.display = "none";
        if (countyLinesLayer.childElementCount > 0) {
          zoomLayer.appendChild(countyLinesLayer);
        }
        if (districtBordersLayer.childElementCount > 0) {
          zoomLayer.appendChild(districtBordersLayer);
        }
        if (countyNamesLayer) {
          countyNamesLayer.style.display = "none";
          zoomLayer.appendChild(countyNamesLayer);
        }
        if (districtNumbersLayer) {
          districtNumbersLayer.style.display = "none";
          zoomLayer.appendChild(districtNumbersLayer);
        }

        return {
          svg,
          zoomLayer,
          districtGroup,
          overlayLayers: {
            districtNumbers: districtNumbersLayer,
            countyLines: countyLinesLayer.childElementCount > 0 ? countyLinesLayer : null,
            countyNames: countyNamesLayer,
          },
        };
      }

      function mountMap(svg, zoomLayer, districtGroup, overlayLayers) {
        els.mapViewport.innerHTML = "";
        els.mapViewport.appendChild(svg);
        app.mapSvg = svg;
        app.districtPaths.clear();
        app.districtNumberLabels.clear();
        app.countyNameLabels = [];
        app.overlayLayers = overlayLayers;
        applyOverlayVisibility();
        wireMapPanZoom(svg, zoomLayer);

        if (overlayLayers?.districtNumbers) {
          overlayLayers.districtNumbers.querySelectorAll("text").forEach((text) => {
            const districtNumber = Number(text.getAttribute("data-district"));
            if (!districtNumber) {
              return;
            }
            app.districtNumberLabels.set(districtNumber, text);
          });
        }
        if (overlayLayers?.countyNames) {
          overlayLayers.countyNames.querySelectorAll("text").forEach((text) => {
            const x = Number(text.getAttribute("data-anchor-x"));
            const y = Number(text.getAttribute("data-anchor-y"));
            if (Number.isFinite(x) && Number.isFinite(y)) {
              app.countyNameLabels.push({ text, x, y });
            }
          });
        }

        districtGroup.querySelectorAll("path").forEach((path) => {
          const districtNumber = Number(path.getAttribute("data-district"));
          if (!districtNumber) {
            return;
          }

          app.districtPaths.set(districtNumber, path);

          path.addEventListener("pointerenter", (event) => {
            if (event.pointerType !== "mouse" || isMapClickSuppressed()) {
              return;
            }
            app.hoveredDistrict = districtNumber;
            path.classList.add("is-hovered");
            showTooltip(districtNumber, event);
          });

          path.addEventListener("pointermove", (event) => {
            updateTapMovement(event);
            if (event.pointerType === "mouse" && app.hoveredDistrict === districtNumber) {
              moveTooltip(event);
            }
          });

          path.addEventListener("pointerleave", (event) => {
            clearTapCandidate(event.pointerId);
            if (event.pointerType !== "mouse") {
              return;
            }
            if (app.hoveredDistrict === districtNumber) {
              app.hoveredDistrict = null;
              hideTooltip();
            }
            path.classList.remove("is-hovered");
          });

          path.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) {
              return;
            }
            app.mapInteraction.activeTapByPointerId.set(event.pointerId, {
              districtNumber,
              startX: event.clientX,
              startY: event.clientY,
              startAt: Date.now(),
              moved: false,
            });
          });

          path.addEventListener("pointerup", (event) => {
            const tapCandidate = app.mapInteraction.activeTapByPointerId.get(event.pointerId);
            clearTapCandidate(event.pointerId);
            if (!tapCandidate || tapCandidate.districtNumber !== districtNumber || event.button !== 0) {
              return;
            }

            const dx = event.clientX - tapCandidate.startX;
            const dy = event.clientY - tapCandidate.startY;
            const duration = Date.now() - tapCandidate.startAt;
            const isTap =
              !tapCandidate.moved &&
              Math.hypot(dx, dy) <= TAP_MAX_MOVEMENT_PX &&
              duration <= TAP_MAX_DURATION_MS &&
              !isMapClickSuppressed();

            if (!isTap) {
              return;
            }

            event.preventDefault();
            openDistrictCard(districtNumber);
          });

          path.addEventListener("pointercancel", (event) => {
            clearTapCandidate(event.pointerId);
          });

          path.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openDistrictCard(districtNumber);
            }
          });
        });

        requestAnimationFrame(() => {
          applyDefaultMapView();
        });
      }

      function wireMapPanZoom(svg, zoomLayer) {
        if (!window.d3 || typeof d3.zoom !== "function" || typeof d3.select !== "function") {
          return;
        }

        const zoomBehavior = d3
          .zoom()
          .filter((event) => {
            if (event.type === "dblclick") {
              return false;
            }
            if (event.type === "mousedown") {
              return event.button === 0;
            }
            return true;
          })
          .scaleExtent([MAP_MIN_ZOOM, MAP_MAX_ZOOM])
          .on("start", () => {
            app.mapInteraction.gestureDidTransform = false;
            clearHoverState();
          })
          .on("zoom", (event) => {
            const previousTransform = app.mapInteraction.currentTransform || d3.zoomIdentity;
            const nextTransform = event.transform;
            app.mapInteraction.currentTransform = nextTransform;
            zoomLayer.setAttribute("transform", nextTransform.toString());

            if (didZoomTransformChange(previousTransform, nextTransform)) {
              app.mapInteraction.gestureDidTransform = true;
              app.suppressMapClickUntil = Date.now() + MAP_GESTURE_CLICK_SUPPRESS_MS;
            }
          })
          .on("end", () => {
            if (app.mapInteraction.gestureDidTransform) {
              app.suppressMapClickUntil = Date.now() + MAP_GESTURE_CLICK_SUPPRESS_MS;
            }
            app.mapInteraction.gestureDidTransform = false;
          });

        const zoomSelection = d3.select(svg);
        zoomSelection.call(zoomBehavior);
        zoomSelection.on("dblclick.zoom", null);

        app.mapInteraction.zoomBehavior = zoomBehavior;
        app.mapInteraction.zoomSelection = zoomSelection;
        app.mapInteraction.zoomLayer = zoomLayer;
        app.mapInteraction.currentTransform = d3.zoomTransform(svg);
      }

      function applyDefaultMapView() {
        const { zoomBehavior, zoomSelection } = app.mapInteraction;
        if (!window.d3 || !zoomBehavior || !zoomSelection) {
          return;
        }

        clearHoverState();
        const defaultScale = window.matchMedia(`(min-width: ${LARGE_SCREEN_MIN_WIDTH}px)`).matches ? MAP_MIN_ZOOM : 1;
        const targetTransform = d3.zoomIdentity.translate(MAP_DEFAULT_PAN_X, 0).scale(defaultScale);
        zoomSelection.call(zoomBehavior.transform, targetTransform);
        app.mapInteraction.currentTransform = targetTransform;
        app.suppressMapClickUntil = Date.now() + MAP_GESTURE_CLICK_SUPPRESS_MS;
      }

      function didZoomTransformChange(previousTransform, nextTransform) {
        return (
          Math.abs(previousTransform.k - nextTransform.k) > ZOOM_EPSILON ||
          Math.abs(previousTransform.x - nextTransform.x) > PAN_EPSILON ||
          Math.abs(previousTransform.y - nextTransform.y) > PAN_EPSILON
        );
      }

      function updateTapMovement(event) {
        const tapCandidate = app.mapInteraction.activeTapByPointerId.get(event.pointerId);
        if (!tapCandidate) {
          return;
        }

        const dx = event.clientX - tapCandidate.startX;
        const dy = event.clientY - tapCandidate.startY;
        if (Math.hypot(dx, dy) > TAP_MAX_MOVEMENT_PX) {
          tapCandidate.moved = true;
        }
      }

      function clearTapCandidate(pointerId) {
        app.mapInteraction.activeTapByPointerId.delete(pointerId);
      }

      function isMapClickSuppressed() {
        return Date.now() < app.suppressMapClickUntil;
      }

      function setOverlay(overlayKey, enabled) {
        app.overlays[overlayKey] = enabled;
        applyOverlayVisibility();
      }

      function applyOverlayVisibility() {
        setOverlayLayerVisibility(app.overlayLayers.districtNumbers, app.overlays.districtNumbers);
        setOverlayLayerVisibility(app.overlayLayers.countyLines, app.overlays.countyLines);
        setOverlayLayerVisibility(app.overlayLayers.countyNames, app.overlays.countyNames);
      }

      function setOverlayLayerVisibility(layer, visible) {
        if (!layer) {
          return;
        }
        layer.style.display = visible ? "block" : "none";
      }

      function openDistrictCard(districtNumber) {
        if (!districtNumber || !app.data) {
          return;
        }

        const district = getDistrict(districtNumber);
        if (!district || !matchesFilter(district)) {
          return;
        }

        app.selectedDistrict = districtNumber;
        renderSelectedDistrict();
        clearHoverState();
        els.mapView.classList.add("hidden");
        els.districtCardView.classList.remove("hidden");
      }

      function setFilter(filter) {
        app.filter = filter;

        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.classList.toggle("active", button.dataset.filter === filter);
        });

        const visible = app.data ? app.data.districts.filter(matchesFilter) : [];
        if (visible.length === 0) {
          app.selectedDistrict = null;
        } else if (!visible.some((district) => district.district === app.selectedDistrict)) {
          app.selectedDistrict = null;
        }

        if (!app.selectedDistrict && !els.districtCardView.classList.contains("hidden")) {
          showMapView();
        }

        paintDistricts();
        renderSelectedDistrict();
      }

      function paintDistricts() {
        if (!app.data) {
          return;
        }

        app.data.districts.forEach((district) => {
          const path = app.districtPaths.get(district.district);
          if (!path) {
            return;
          }

          const visible = matchesFilter(district);
          const fillColor = visible ? getDistrictColor(district) : getFilteredOutColor();
          path.setAttribute("fill", fillColor);
          path.setAttribute("fill-opacity", "1");
          path.style.fill = fillColor;
          path.style.fillOpacity = "1";
          path.style.opacity = "1";
          path.style.pointerEvents = visible ? "auto" : "none";
          if (district.district !== app.hoveredDistrict) path.classList.remove("is-hovered");
        });

        updateDistrictNumberColors();
        updateCountyNameColors();
      }

      function updateDistrictNumberColors() {
        if (!app.districtNumberLabels.size) {
          return;
        }

        app.districtNumberLabels.forEach((label, districtNumber) => {
          const district = getDistrict(districtNumber);
          const districtFill = district && matchesFilter(district) ? getDistrictColor(district) : getFilteredOutColor();
          label.setAttribute("fill", getReadableTextColorForFill(districtFill));
        });
      }

      function updateCountyNameColors() {
        if (!app.countyNameLabels.length) {
          return;
        }

        app.countyNameLabels.forEach(({ text, x, y }) => {
          const fillColor = getDistrictFillAtMapPoint(x, y);
          text.setAttribute("fill", getReadableTextColorForFill(fillColor || getFilteredOutColor()));
        });
      }

      function getDistrictFillAtMapPoint(x, y) {
        if (!Number.isFinite(x) || !Number.isFinite(y)) {
          return null;
        }

        const candidatePoints = [
          [x, y],
          [x + 1, y],
          [x - 1, y],
          [x, y + 1],
          [x, y - 1],
          [x + 1, y + 1],
          [x - 1, y + 1],
          [x + 1, y - 1],
          [x - 1, y - 1],
          [x + 2, y],
          [x - 2, y],
          [x, y + 2],
          [x, y - 2],
        ];

        for (const [sampleX, sampleY] of candidatePoints) {
          const point = createMapPoint(sampleX, sampleY);
          if (!point) {
            continue;
          }

          for (const [districtNumber, path] of app.districtPaths.entries()) {
            if (typeof path.isPointInFill !== "function" || !path.isPointInFill(point)) {
              continue;
            }

            const district = getDistrict(districtNumber);
            if (!district) {
              return null;
            }
            return matchesFilter(district) ? getDistrictColor(district) : getFilteredOutColor();
          }
        }

        return null;
      }

      function createMapPoint(x, y) {
        if (typeof DOMPoint === "function") {
          return new DOMPoint(x, y);
        }

        if (app.mapSvg && typeof app.mapSvg.createSVGPoint === "function") {
          const point = app.mapSvg.createSVGPoint();
          point.x = x;
          point.y = y;
          return point;
        }

        return null;
      }

      function getTextAnchorPoint(text) {
        if (!text) {
          return null;
        }

        const transform = text.getAttribute("transform") || "";
        const translateMatch = transform.match(/translate\(\s*(-?\d*\.?\d+)(?:[\s,]+(-?\d*\.?\d+))?\s*\)/i);
        if (translateMatch) {
          return {
            x: Number(translateMatch[1]),
            y: Number(translateMatch[2] || 0),
          };
        }

        const x = Number(text.getAttribute("x"));
        const y = Number(text.getAttribute("y"));
        if (Number.isFinite(x) && Number.isFinite(y)) {
          return { x, y };
        }

        if (typeof text.getBBox === "function") {
          try {
            const box = text.getBBox();
            return {
              x: box.x + box.width / 2,
              y: box.y + box.height / 2,
            };
          } catch {
            return null;
          }
        }

        return null;
      }

      function getReadableTextColorForFill(fillColor) {
        const rgb = parseColorToRgb(fillColor);
        if (!rgb) {
          return "#000000";
        }
        const luminance = getRelativeLuminance(rgb.r, rgb.g, rgb.b);
        return luminance >= 0.5 ? "#000000" : "#ffffff";
      }

      function parseColorToRgb(colorValue) {
        if (typeof colorValue !== "string") {
          return null;
        }

        const trimmed = colorValue.trim();
        const hexMatch = trimmed.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
        if (hexMatch) {
          const hex = hexMatch[1];
          if (hex.length === 3) {
            return {
              r: Number.parseInt(hex[0] + hex[0], 16),
              g: Number.parseInt(hex[1] + hex[1], 16),
              b: Number.parseInt(hex[2] + hex[2], 16),
            };
          }
          return {
            r: Number.parseInt(hex.slice(0, 2), 16),
            g: Number.parseInt(hex.slice(2, 4), 16),
            b: Number.parseInt(hex.slice(4, 6), 16),
          };
        }

        const rgbMatch = trimmed.match(
          /^rgba?\(\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})(?:\s*,\s*[0-9.]+\s*)?\)$/i
        );
        if (!rgbMatch) {
          return null;
        }

        return {
          r: clampRgbChannel(rgbMatch[1]),
          g: clampRgbChannel(rgbMatch[2]),
          b: clampRgbChannel(rgbMatch[3]),
        };
      }

      function clampRgbChannel(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) {
          return 0;
        }
        return Math.max(0, Math.min(255, numeric));
      }

      function getRelativeLuminance(r, g, b) {
        const toLinear = (channel) => {
          const normalized = channel / 255;
          return normalized <= 0.03928 ? normalized / 12.92 : Math.pow((normalized + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
      }

      function renderSelectedDistrict() {
        if (!app.data || !app.selectedDistrict) {
          els.selectedTitle.textContent = "District -";
          els.selectedIncumbent.textContent = "";
          els.selectedPvi.textContent = "";
          applySeatHolderCardStyle(null, els.selectedIncumbentCard);
          applyCookPviCardStyle(null, els.selectedPviCard);
          els.candidateLists.innerHTML = "";
          return;
        }

        const district = getDistrict(app.selectedDistrict);
        if (!district) {
          return;
        }

        els.selectedTitle.textContent = `District ${district.district}`;
        els.selectedIncumbent.textContent = `${district.current_holder.name} (${district.current_holder.party})`;
        els.selectedPvi.textContent = getCookPviLabel(district);
        applySeatHolderCardStyle(district, els.selectedIncumbentCard);
        applyCookPviCardStyle(district, els.selectedPviCard);

        els.candidateLists.innerHTML = "";
        els.candidateLists.appendChild(
          buildCandidateSection("Democratic", district.candidates.democratic, "D")
        );
        els.candidateLists.appendChild(
          buildCandidateSection("Republican", district.candidates.republican, "R")
        );
        els.candidateLists.appendChild(
          buildCandidateSection("Other", district.candidates.other, "OTHER")
        );
      }

      function showMapView() {
        app.selectedDistrict = null;
        renderSelectedDistrict();
        els.districtCardView.classList.add("hidden");
        els.mapView.classList.remove("hidden");
        clearHoverState();
        paintDistricts();
        requestAnimationFrame(() => {
          const { zoomBehavior, zoomSelection, currentTransform } = app.mapInteraction;
          if (!window.d3 || !zoomBehavior || !zoomSelection || !currentTransform) {
            return;
          }
          zoomSelection.call(zoomBehavior.transform, currentTransform);
        });
      }

      function clearHoverState() {
        app.hoveredDistrict = null;
        app.districtPaths.forEach((path) => path.classList.remove("is-hovered"));
        hideTooltip();
      }

      function buildCandidateSection(title, candidates, partyKey) {
        const section = document.createElement("section");
        section.className = "rounded-xl border p-3";

        const style = getCandidateSectionStyle(partyKey);
        section.style.backgroundColor = style.bg;
        section.style.borderColor = style.border;

        const heading = document.createElement("h4");
        heading.className = "text-sm font-semibold";
        heading.style.color = style.heading;
        heading.textContent = `${title} Candidates`;
        section.appendChild(heading);

        if (!candidates.length) {
          const empty = document.createElement("p");
          empty.className = "mt-1 text-sm";
          empty.style.color = style.text;
          empty.textContent = "No candidates listed.";
          section.appendChild(empty);
          return section;
        }

        const list = document.createElement("ul");
        list.className = "mt-2 space-y-1";

        const sortedCandidates = [...candidates].sort((a, b) =>
          String(a.name).localeCompare(String(b.name), undefined, { sensitivity: "base" })
        );

        sortedCandidates.forEach((candidate) => {
          const item = document.createElement("li");
          item.className = "rounded-md px-2 py-1 text-sm";
          item.style.backgroundColor = style.itemBg;
          item.style.color = style.itemText;
          item.textContent = `${candidate.name} (${candidate.party})`;
          list.appendChild(item);
        });

        section.appendChild(list);
        return section;
      }

      function showTooltip(districtNumber, event = null) {
        const district = getDistrict(districtNumber);
        if (!district) {
          return;
        }

        const seatHolderStyle = getSeatHolderCardStyle(district);
        const democraticCount = district.candidates.democratic.length;
        const republicanCount = district.candidates.republican.length;
        const otherCount = district.candidates.other.length;
        const cookPviLabel = getCookPviLabel(district);
        const cookPviCardStyle = getCookPviCardStyle(district);
        els.mapTooltip.innerHTML = `
          <p class="font-semibold text-slate-900">District ${district.district}</p>
          <div class="mt-2 rounded-md border p-2" style="background-color: ${seatHolderStyle.bg}; border-color: ${seatHolderStyle.border};">
            <p class="text-[11px] font-semibold uppercase tracking-wide" style="color: ${seatHolderStyle.label};">Incumbent</p>
            <p class="mt-1" style="color: ${seatHolderStyle.text};">
              ${escapeHtml(district.current_holder.name)} (${escapeHtml(district.current_holder.party)})
            </p>
          </div>
          <div class="mt-2 rounded-md border p-2" style="background-color: ${cookPviCardStyle.bg}; border-color: ${cookPviCardStyle.border};">
            <p class="text-[11px] font-semibold uppercase tracking-wide" style="color: ${cookPviCardStyle.label};">2025 Cook PVI</p>
            <p class="mt-1 font-semibold" style="color: ${cookPviCardStyle.text};">${escapeHtml(cookPviLabel)}</p>
          </div>
          <div class="mt-2 rounded-md border border-slate-200 bg-white p-2">
            <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Candidate Counts</p>
            <p class="mt-1 text-slate-700">Democratic: ${democraticCount}</p>
            <p class="text-slate-700">Republican: ${republicanCount}</p>
            <p class="text-slate-700">Other: ${otherCount}</p>
          </div>
          <p class="mt-2 border-t border-slate-200 pt-2 text-slate-700">Click for details</p>
        `;
        els.mapTooltip.classList.remove("hidden");
        if (event && typeof event.clientX === "number" && typeof event.clientY === "number") {
          moveTooltip(event);
        } else {
          pinTooltipTopLeft();
        }
      }

      function moveTooltip(event) {
        const frameRect = els.mapFrame.getBoundingClientRect();
        const tooltip = els.mapTooltip;

        const cursorX = event.clientX - frameRect.left;
        const cursorY = event.clientY - frameRect.top;
        const tooltipWidth = tooltip.offsetWidth;
        const tooltipHeight = tooltip.offsetHeight;
        const margin = 8;
        const pointerGap = 12;
        const minX = margin;
        const minY = margin;
        const maxX = Math.max(margin, frameRect.width - tooltipWidth - margin);
        const maxY = Math.max(margin, frameRect.height - tooltipHeight - margin);

        const fitsOnScreen = (x, y) =>
          x >= minX && y >= minY && x <= maxX && y <= maxY;
        const clamp = (value, min, max) => Math.max(min, Math.min(value, max));
        const cursorInside = (x, y) =>
          cursorX >= x && cursorX <= x + tooltipWidth && cursorY >= y && cursorY <= y + tooltipHeight;

        const candidates = [
          { x: cursorX + pointerGap, y: cursorY - tooltipHeight - pointerGap }, // right + above
          { x: cursorX - tooltipWidth - pointerGap, y: cursorY - tooltipHeight - pointerGap }, // left + above
          { x: cursorX + pointerGap, y: cursorY - tooltipHeight / 2 }, // right side
          { x: cursorX - tooltipWidth - pointerGap, y: cursorY - tooltipHeight / 2 }, // left side
          { x: cursorX + pointerGap, y: cursorY + pointerGap }, // right + below
          { x: cursorX - tooltipWidth - pointerGap, y: cursorY + pointerGap }, // left + below
        ];

        let placement = candidates.find(({ x, y }) => fitsOnScreen(x, y));

        if (!placement) {
          // Prefer above-cursor placement first, then adapt while staying in-bounds.
          let x = clamp(cursorX + pointerGap, minX, maxX);
          let y = clamp(cursorY - tooltipHeight - pointerGap, minY, maxY);

          // If clamping put the tooltip under the pointer, try alternate positions.
          if (cursorInside(x, y)) {
            const belowY = clamp(cursorY + pointerGap, minY, maxY);
            if (!cursorInside(x, belowY)) {
              y = belowY;
            } else {
              const leftX = clamp(cursorX - tooltipWidth - pointerGap, minX, maxX);
              if (!cursorInside(leftX, y)) {
                x = leftX;
              }
            }
          }

          placement = { x, y };
        }

        tooltip.style.transform = `translate(${placement.x}px, ${placement.y}px)`;
      }

      function hideTooltip() {
        els.mapTooltip.classList.add("hidden");
      }

      function pinTooltipTopLeft() {
        els.mapTooltip.style.transform = "translate(12px, 12px)";
      }

      function applySeatHolderCardStyle(district, element) {
        if (!element) {
          return;
        }
        const style = getSeatHolderCardStyle(district);
        element.style.backgroundColor = style.bg;
        element.style.borderColor = style.border;

        const label = element.querySelector("h3");
        if (label) {
          label.style.color = style.label;
        }

        const value = element.querySelector("p");
        if (value) {
          value.style.color = style.text;
        }
      }

      function applyCookPviCardStyle(district, element) {
        if (!element) {
          return;
        }

        const style = getCookPviCardStyle(district);
        element.style.backgroundColor = style.bg;
        element.style.borderColor = style.border;

        const label = element.querySelector("h3");
        if (label) {
          label.style.color = style.label;
        }

        const value = element.querySelector("p");
        if (value) {
          value.style.color = style.text;
        }
      }

      function getSeatHolderCardStyle(district) {
        const isDark = app.theme === "dark";
        if (!district) {
          return isDark
            ? { bg: "#1e293b", border: "#475569", label: "#cbd5e1", text: "#e2e8f0" }
            : { bg: "#f8fafc", border: "#cbd5e1", label: "#475569", text: "#334155" };
        }

        const party = getPartyKey(district);
        if (party === "D") {
          return isDark
            ? { bg: "#172554", border: "#1d4ed8", label: "#bfdbfe", text: "#dbeafe" }
            : { bg: "#dbeafe", border: "#60a5fa", label: "#1e3a8a", text: "#1e40af" };
        }
        if (party === "R") {
          return isDark
            ? { bg: "#450a0a", border: "#b91c1c", label: "#fecaca", text: "#fee2e2" }
            : { bg: "#fee2e2", border: "#f87171", label: "#991b1b", text: "#b91c1c" };
        }
        return isDark
          ? { bg: "#451a03", border: "#d97706", label: "#fde68a", text: "#fef3c7" }
          : { bg: "#fef3c7", border: "#fbbf24", label: "#92400e", text: "#a16207" };
      }

      function getCookPviCardStyle(district) {
        const isDark = app.theme === "dark";
        const pvi = parseCookPvi(district?.cook_pvi_2025);

        if (!pvi) {
          return isDark
            ? { bg: "#1e293b", border: "#475569", label: "#cbd5e1", text: "#e2e8f0" }
            : { bg: "#f8fafc", border: "#cbd5e1", label: "#475569", text: "#334155" };
        }

        if (pvi.party === "D") {
          return isDark
            ? { bg: "#172554", border: "#1d4ed8", label: "#bfdbfe", text: "#dbeafe" }
            : { bg: "#eff6ff", border: "#bfdbfe", label: "#1e3a8a", text: "#1e40af" };
        }

        return isDark
          ? { bg: "#450a0a", border: "#b91c1c", label: "#fecaca", text: "#fee2e2" }
          : { bg: "#fef2f2", border: "#fecaca", label: "#991b1b", text: "#b91c1c" };
      }

      function getCandidateSectionStyle(partyKey) {
        const isDark = app.theme === "dark";

        if (partyKey === "D") {
          return isDark
            ? {
                bg: "#172554",
                border: "#1d4ed8",
                heading: "#bfdbfe",
                text: "#dbeafe",
                itemBg: "#1e3a8a",
                itemText: "#dbeafe",
              }
            : {
                bg: "#eff6ff",
                border: "#bfdbfe",
                heading: "#1e3a8a",
                text: "#1e40af",
                itemBg: "rgba(255, 255, 255, 0.85)",
                itemText: "#334155",
              };
        }

        if (partyKey === "R") {
          return isDark
            ? {
                bg: "#450a0a",
                border: "#b91c1c",
                heading: "#fecaca",
                text: "#fee2e2",
                itemBg: "#7f1d1d",
                itemText: "#fee2e2",
              }
            : {
                bg: "#fef2f2",
                border: "#fecaca",
                heading: "#991b1b",
                text: "#b91c1c",
                itemBg: "rgba(255, 255, 255, 0.85)",
                itemText: "#334155",
              };
        }

        return isDark
          ? {
              bg: "#451a03",
              border: "#d97706",
              heading: "#fde68a",
              text: "#fef3c7",
              itemBg: "#78350f",
              itemText: "#fef3c7",
            }
          : {
              bg: "#fffbeb",
              border: "#fde68a",
              heading: "#92400e",
              text: "#a16207",
              itemBg: "rgba(255, 255, 255, 0.85)",
              itemText: "#334155",
            };
      }

      function getDistrictColor(district) {
        if (app.colorMode === "pvi") {
          return getDistrictPviColor(district);
        }
        const party = getPartyKey(district);
        return DISTRICT_FILL_DARK_BY_PARTY[party];
      }

      function getDistrictPviColor(district) {
        const pvi = parseCookPvi(district?.cook_pvi_2025);
        if (!pvi) {
          return DISTRICT_FILL_DARK_BY_PARTY[getPartyKey(district)];
        }
        return getPviFillColor(pvi.party, pvi.margin);
      }

      function getPviFillColor(party, margin) {
        const numericMargin = Number.isFinite(Number(margin)) ? Number(margin) : 0;
        const safeMargin = Math.max(0, numericMargin);
        const stop =
          PVI_COLOR_STOPS.find((entry) => safeMargin >= entry.min) || PVI_COLOR_STOPS[PVI_COLOR_STOPS.length - 1];
        return party === "D" ? stop.D : stop.R;
      }

      function getFilteredOutColor() {
        return app.theme === "dark" ? FILTERED_OUT_FILL_DARK : FILTERED_OUT_FILL_LIGHT;
      }

      function matchesFilter(district) {
        if (app.filter === "all") {
          return true;
        }
        if (app.filter === "noD") {
          return (district.candidates?.democratic?.length ?? 0) === 0;
        }
        if (app.filter === "noR") {
          return (district.candidates?.republican?.length ?? 0) === 0;
        }
        return district.current_holder?.party === app.filter;
      }

      function getPartyKey(district) {
        if (district?.current_holder?.party === "D") {
          return "D";
        }
        if (district?.current_holder?.party === "R") {
          return "R";
        }
        return "OTHER";
      }

      function getDistrict(districtNumber) {
        return app.data?.districts.find((district) => district.district === districtNumber) ?? null;
      }

      function normalizeCookPvi(value) {
        const parsed = parseCookPvi(value);
        return parsed ? `${parsed.party}+${parsed.margin}` : null;
      }

      function parseCookPvi(value) {
        if (typeof value !== "string") {
          return null;
        }

        const match = value.trim().toUpperCase().match(/^([DR])\+(\d+)$/);
        if (!match) {
          return null;
        }
        return { party: match[1], margin: Number(match[2]) };
      }

      function getCookPviLabel(district) {
        return district?.cook_pvi_2025 || "N/A";
      }

      function parseDistrictNumber(idValue) {
        if (!idValue) {
          return null;
        }
        const match = String(idValue).match(/(\d+)\s*$/);
        return match ? Number(match[1]) : null;
      }

      function formatDate(isoDate) {
        if (!isoDate) {
          return "N/A";
        }
        const date = new Date(`${isoDate}T12:00:00`);
        return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" }).format(date);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => {
          if (char === "&") return "&amp;";
          if (char === "<") return "&lt;";
          if (char === ">") return "&gt;";
          if (char === '"') return "&quot;";
          return "&#39;";
        });
      }

      function showMapMessage(message, isError = false) {
        els.mapViewport.innerHTML = "";
        const text = document.createElement("p");
        text.className = `px-5 text-center text-sm ${isError ? "text-rose-600" : "text-slate-500"}`;
        text.textContent = message;
        els.mapViewport.appendChild(text);
      }
    </script>
  </body>
</html>
